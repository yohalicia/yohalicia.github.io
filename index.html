<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Students by major</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.1.2/handlebars.min.js"></script>

</head>
<body>

    <h2>Select a Major</h2>
    
    <input type="button" id="citBtn" value="CIT Majors">
    <input type="button" id="businessBtn" value="Business Majors">
	
	<h4>We filter our dataset by major</h4>

    <div id="result"></div>

	
	<script type="text/x-handlebars-template" id="tableTemplate">
		<table cellspacing='12'>
			<tr><th>name</th><th>major</th><th>midterm</th><th>final</th></tr>
			{{#each rows}}
				<tr>
					<td>{{name}}</td><td>{{major}}</td><td>{{midterm}}</td><td>{{final}}</td>
				</tr>
			{{/each}}
		</table>
	</script>
	

<script>
    window.onload = async function() {
        var url = "cit5students.json";
        var response = await fetch(url);
        if(response.ok) {

            var data = await response.json();

            var templateText = document.getElementById('tableTemplate').innerHTML;
            var compiledTemplateText = Handlebars.compile(templateText);
			
			function showMajor(majorCode) {
			var filtered = [];

			for (var i = 0; i < data.length; i++) {
				if (data[i].major === majorCode) {
					filtered.push(data[i]);
				}
			}

			var compiledHtml = compiledTemplateText({ rows: filtered });
			document.getElementById('result').innerHTML = compiledHtml;
            }
			
			document.getElementById("citBtn").onclick = function() {
                showMajor("CIT");
            };
			
			document.getElementById("businessBtn").onclick = function() {
                showMajor("BUS");
            };
        }
        else {
            document.querySelector('#result').innerHTML = "Data not found";
        }

    }
  
</script>

</body>
</html>
