<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Students by major</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.1.2/handlebars.min.js"></script>

    <style> <!-- check if needed -->
        body { margin-left: 30px; font-family: Arial; }
    </style>
</head>
<body>

    <h2>Select a Major</h2>
    
    <input type="button" id="citBtn" value="CIT Majors">
    <input type="button" id="businessBtn" value="Business Majors">
	
	<h4>We filter our dataset by major</h4>

    <div id="result"></div>

	
	<script type="text/x-handlebars-template" id="tableTemplate">
		<table cellspacing='12'>
			<tr><th>Name</th><th>Major</th><th>Midterm</th><th>Final</th></tr>
			{{#each rows}}
				<tr>
					<td>{{name}}</td><td>{{Major}}</td><td>{{Midterm}}</td><td>{{Final}}</td>
				</tr>
			{{/each}}
		</table>
	</script>
	

<script>
    window.onload = async function() {
        var url = "cit5students.json";     // the data
        var response = await fetch(url);
        if(response.ok) {

            var data = await response.json();

            var templateText = document.getElementById('tableTemplate').innerHTML; // Get template text 
            var compiledTemplateText = Handlebars.compile(templateText);    // Compile the Handlebars template
            compiledHtml = compiledTemplateText({ rows: data })             // Evaluate the template
			document.getElementById('peopleTable').innerHTML = compiledHtml; 	// put html table into division
        }
        else {
            document.querySelector('#peopleTable').innerHTML = "Data not found";
        }

    }
  
</script>

</body>
</html>
   
</body>
</html>
